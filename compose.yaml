name: private-payments
services:
  proof-server:
    image: midnightntwrk/proof-server:8.1.0
    command: ["midnight-proof-server", "-v"]
    ports:
      - "127.0.0.1:${PROOF_SERVER_PORT:-6300}:6300"
    restart: "no"
    security_opt:
      - no-new-privileges:true
# Image tag and invocation are documented, not pulled or tested here.
# No invented HTTP health route. A TCP check is not a successful proof.
