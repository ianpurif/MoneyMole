name: private-payments
services:
  proof-server:
    image: midnightntwrk/proof-server:8.1.0@sha256:801bbc0340e9e96f16735f77b523f23c7459e3359842f7c79c2c53f4e994d531
    # Use the inspected image's default entrypoint/Cmd and PORT=6300.
    ports:
      - "127.0.0.1:${PROOF_SERVER_PORT:-6300}:6300"
    restart: "no"
    security_opt:
      - no-new-privileges:true
# Image digest and default command inspected locally on 2026-09-26.
# No invented HTTP health route. A TCP check is not a successful proof.
