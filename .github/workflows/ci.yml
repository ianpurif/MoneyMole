name: Engineering verification
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: engineering-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-09-26
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, resolved 2026-09-26
        with:
          node-version: 22.16.0
      - name: Pin package manager
        run: npm install --global npm@10.9.2
      - name: Reject unresolved preparation dependency graph
        run: test -s package-lock.json
      - name: Install exactly the locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit production and development dependencies
        run: npm run audit:deps
      - name: Check preparation utilities and evidence references
        run: npm run check:offline
      - name: Install reviewed pinned Compact toolchain
        run: |
          node scripts/install-compact.mjs --approve-reviewed-installer
          echo "$GITHUB_WORKSPACE/.local/compact/bin" >> "$GITHUB_PATH"
          echo "COMPACT_DIRECTORY=$GITHUB_WORKSPACE/.local/compact/artifacts" >> "$GITHUB_ENV"
      - name: Compile actual payment contracts and verify generated artifacts
        run: |
          npm run compile:contracts
          npm run compile:issuance
          npm run verify:artifacts
      - name: Lint and typecheck
        run: |
          npm run lint
          npm run typecheck
      - name: Deterministic and contract integration suites
        run: |
          npm run test:unit
          npm run test:contracts
          npm run test:integration
      - name: Production build
        run: npm run build
      - name: Browser security and synthetic authorization checks
        run: |
          npm exec -- playwright install --with-deps chromium
          npm run test:browser
      - name: Requirement consistency
        run: npm run requirements:check
# No live wallet, signing secret or network-changing transaction is allowed in
# an untrusted push/PR job. Owner-run Preprod acceptance is a separate procedure.
# Exact action commits were resolved from the official v4 refs; no remote run is implied.
